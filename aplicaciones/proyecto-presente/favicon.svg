<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Background Gradient: Deep Royal UdeG Navy -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1d4ed8" />
      <stop offset="60%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Gold Accent Gradient: UdeG Gold -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="35%" stop-color="#facc15" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>

    <!-- Shadow filter for contrast at small sizes -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Squircle Base with Gold Rim -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="#facc15" stroke-width="2.5" />

  <!-- Institutional Heraldic Shield Silhouette (SEMS UdeG) -->
  <path d="M15 15 H49 V32 C49 42.5 32 50.5 32 50.5 C32 50.5 15 42.5 15 32 Z" 
        fill="#1e3a8a" 
        fill-opacity="0.5" 
        stroke="#eab308" 
        stroke-width="1.2" 
        stroke-opacity="0.75" />

  <!-- Bold 'P' of ¡PRESENTE! (Crisp and legible at 16x16 and 32x32) -->
  <g filter="url(#shadow)">
    <!-- Letter P -->
    <path d="M22 17.5 H37 C42.5 17.5 46.5 20.8 46.5 26 C46.5 31.2 42.5 34.5 37 34.5 H29.5 V46.5 H22 Z M29.5 23 V29 H36.5 C38.8 29 40.2 27.9 40.2 26 C40.2 24.1 38.8 23 36.5 23 Z" 
          fill="url(#goldGrad)" />
    
    <!-- Presence Beacon Indicator (Golden Star / Diamond) -->
    <circle cx="43" cy="42" r="3.5" fill="#facc15" stroke="#ffffff" stroke-width="1.2" />
  </g>
</svg>
