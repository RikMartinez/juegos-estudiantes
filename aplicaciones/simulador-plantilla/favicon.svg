<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Gradiente de Fondo Azul Marino Profundo UdeG -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1A30"/>
      <stop offset="50%" stop-color="#071324"/>
      <stop offset="100%" stop-color="#020813"/>
    </linearGradient>

    <!-- Gradiente Dorado UdeG (Docencia y Excelencia) -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="35%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>

    <!-- Gradiente Aguamarina / Cian (Olas del Lago de Chapala) -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67E8F9"/>
      <stop offset="50%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>

    <!-- Borde con brillo sutil -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#F59E0B" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#1E3A8A" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Brillo dorado -->
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#F59E0B" flood-opacity="0.45"/>
    </filter>

    <!-- Brillo cian -->
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#06B6D4" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Contenedor Base redondeado tipo App Icon -->
  <rect width="64" height="64" rx="15" fill="url(#bgGrad)"/>
  <rect width="64" height="64" rx="15" fill="none" stroke="url(#borderGrad)" stroke-width="1.5"/>

  <!-- 1. Birrete Académico (Docencia Universitaria) -->
  <g filter="url(#goldGlow)">
    <!-- Rombo superior del birrete -->
    <polygon points="32,9 53,17.5 32,26 11,17.5" fill="#0A1A2F" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linejoin="round"/>
    
    <!-- Casquete inferior del birrete -->
    <path d="M 21.5 21.8 L 21.5 27.5 C 21.5 31.8 42.5 31.8 42.5 27.5 L 42.5 21.8" fill="none" stroke="url(#goldGrad)" stroke-width="2.2" stroke-linecap="round"/>

    <!-- Borla colgante -->
    <path d="M 47 19.8 L 48.8 26.5 L 48.8 30" fill="none" stroke="url(#goldGrad)" stroke-width="1.8" stroke-linecap="round"/>
    <circle cx="48.8" cy="31.2" r="1.3" fill="url(#goldGrad)"/>
  </g>

  <!-- 2. Libro Abierto (Simulador de Asignaturas / Carga Académica) -->
  <g filter="url(#goldGlow)">
    <!-- Hojas del libro -->
    <path d="M 32 35.5 C 26 32 17.5 33 13 35 L 13 43.5 C 18 41.5 26 40.8 32 44.5 C 38 40.8 46 41.5 51 43.5 L 51 35 C 46.5 33 38 32 32 35.5 Z" 
          fill="#0B1A30" stroke="url(#goldGrad)" stroke-width="2.2" stroke-linejoin="round"/>
    
    <!-- Pliegue central del lomo -->
    <line x1="32" y1="35.5" x2="32" y2="44.5" stroke="url(#goldGrad)" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- 3. Olas Estilizadas del Lago de Chapala (Identidad Regional) -->
  <g filter="url(#cyanGlow)">
    <!-- Primera ola (superior) -->
    <path d="M 14.5 49.5 C 19 46.5 24 46.5 28.5 49.5 C 33 52.5 38 52.5 42.5 49.5 C 45.5 47.5 48 48 49.5 49.5" 
          fill="none" stroke="url(#cyanGrad)" stroke-width="2.4" stroke-linecap="round"/>

    <!-- Segunda ola (inferior) -->
    <path d="M 19 55 C 23 52.8 27.5 52.8 31.5 55 C 35.5 57.2 40 57.2 44.5 55" 
          fill="none" stroke="url(#cyanGrad)" stroke-width="2" stroke-linecap="round" opacity="0.9"/>
  </g>
</svg>