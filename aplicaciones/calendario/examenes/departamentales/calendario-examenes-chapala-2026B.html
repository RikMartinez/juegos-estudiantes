<html lang="es">
<head>

  <style>
    :root {
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --primary-light: #eff6ff;
    }
    .dark {
      --bg: #090d16;
      --card-bg: #0f172a;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: #1e293b;
      --primary: #3b82f6;
      --primary-hover: #60a5fa;
      --primary-light: #1e293b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      padding-bottom: 3rem;
    }
    header {
      background: var(--card-bg);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 40;
      padding: 0.75rem 1rem;
    }
    .header-inner {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      flex-wrap: wrap;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }
    .brand-icon {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: linear-gradient(135deg, #1d4ed8, #4338ca);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 1.1rem;
    }
    .brand h1 { font-size: 1rem; font-weight: 700; }
    .brand p { font-size: 0.75rem; color: var(--text-muted); }
    .container {
      max-width: 1200px;
      margin: 1.5rem auto;
      padding: 0 1rem;
    }
    .controls {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
      align-items: center;
      margin-bottom: 1.25rem;
      background: var(--card-bg);
      padding: 1rem;
      border-radius: 12px;
      border: 1px solid var(--border);
    }
    .search-input {
      flex: 1;
      min-width: 220px;
      padding: 0.5rem 0.75rem;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      font-size: 0.85rem;
    }
    select, button {
      padding: 0.5rem 0.75rem;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--card-bg);
      color: var(--text);
      font-size: 0.85rem;
      cursor: pointer;
      font-weight: 500;
    }
    button.primary {
      background: var(--primary);
      color: white;
      border-color: var(--primary);
    }
    .day-tabs {
      display: flex;
      gap: 0.5rem;
      overflow-x: auto;
      padding-bottom: 0.5rem;
      margin-bottom: 1rem;
    }
    .day-tab {
      padding: 0.5rem 1rem;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--card-bg);
      white-space: nowrap;
      font-size: 0.8rem;
      font-weight: 600;
    }
    .day-tab.active {
      background: var(--primary);
      color: white;
      border-color: var(--primary);
    }
    .grid-labs {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 1rem;
    }
    .lab-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
    }
    .lab-header {
      padding: 0.75rem 1rem;
      background: var(--primary-light);
      border-bottom: 1px solid var(--border);
      font-weight: 700;
      font-size: 0.9rem;
      display: flex;
      justify-content: space-between;
    }
    .exam-item {
      padding: 0.75rem;
      border-bottom: 1px solid var(--border);
      transition: background 0.15s;
    }
    .exam-item:last-child { border-bottom: none; }
    .exam-item:hover { background: var(--bg); }
    .exam-time {
      font-size: 0.75rem;
      color: var(--text-muted);
      font-family: monospace;
      margin-bottom: 0.25rem;
      display: flex;
      justify-content: space-between;
    }
    .exam-title {
      font-size: 0.85rem;
      font-weight: 600;
      line-height: 1.3;
    }
    .exam-meta {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-top: 0.25rem;
    }
    .badge {
      display: inline-block;
      padding: 0.15rem 0.5rem;
      border-radius: 4px;
      font-size: 0.7rem;
      font-weight: 700;
      background: #e2e8f0;
      color: #1e293b;
    }
    .dark .badge { background: #334155; color: #f8fafc; }
    .badge-turismo { background: #ccfbf1; color: #0f766e; }
    .badge-matutino { background: #e0f2fe; color: #0369a1; }
    .badge-vespertino { background: #ede9fe; color: #5b21b6; }
    .badge-tae { background: #fef3c7; color: #b45309; }
    @media print {
      header, .controls, .day-tabs { display: none !important; }
      body { background: white !important; color: black !important; }
      .lab-card { break-inside: avoid; border: 1px solid #ccc; margin-bottom: 1rem; }
    }
  </style>
</head>

    const DAYS = [{"index":0,"name":"Viernes 20 de noviembre","short":"Vie 20 Nov","date":"2026-11-20"},{"index":1,"name":"Lunes 23 de noviembre","short":"Lun 23 Nov","date":"2026-11-23"},{"index":2,"name":"Martes 24 de noviembre","short":"Mar 24 Nov","date":"2026-11-24"},{"index":3,"name":"Miércoles 25 de noviembre","short":"Mié 25 Nov","date":"2026-11-25"},{"index":4,"name":"Jueves 26 de noviembre","short":"Jue 26 Nov","date":"2026-11-26"},{"index":5,"name":"Viernes 27 de noviembre","short":"Vie 27 Nov","date":"2026-11-27"},{"index":6,"name":"Lunes 30 de noviembre","short":"Lun 30 Nov","date":"2026-11-30"}];
    const SLOTS = ["07:00 - 08:00","08:00 - 09:00","09:00 - 10:00","10:00 - 11:00","11:00 - 12:00","12:00 - 13:00","13:00 - 14:00","14:00 - 15:00","15:00 - 16:00","16:00 - 17:00","17:00 - 18:00","18:00 - 19:00"];
    const LABS = ["Lab. 1","Lab. 2","Lab. 3"];

    let activeDay = 0;

    // Populate groups
    const groups = Array.from(new Set(SCHEDULE.map(e => e.group).filter(Boolean))).sort();
    const groupSelect = document.getElementById('groupFilter');
    groups.forEach(g => {
      const opt = document.createElement('option');
      opt.value = g;
      opt.textContent = g;
      groupSelect.appendChild(opt);
    });

    // Render day tabs
    const dayTabs = document.getElementById('dayTabs');
    DAYS.forEach(d => {
      const btn = document.createElement('button');
      btn.className = 'day-tab' + (d.index === activeDay ? ' active' : '');
      btn.textContent = d.short;
      btn.onclick = () => {
        activeDay = d.index;
        document.querySelectorAll('.day-tab').forEach((b, i) => b.classList.toggle('active', i === activeDay));
        renderApp();
      };
      dayTabs.appendChild(btn);
    });

    function toggleDarkMode() {
      document.documentElement.classList.toggle('dark');
    }

    function renderApp() {
      const q = document.getElementById('searchInput').value.toLowerCase().trim();
      const shift = document.getElementById('shiftFilter').value;
      const group = document.getElementById('groupFilter').value;

      const filtered = SCHEDULE.filter(e => {
        if (e.isEmpty) return false;
        if (q && !e.title.toLowerCase().includes(q) && !e.group.toLowerCase().includes(q) && !e.time.includes(q)) return false;
        if (group !== 'todos' && e.group !== group) return false;
        if (shift !== 'todos') {
          if (shift === 'BTT' && !e.shift.includes('BTT') && e.type !== 'turismo') return false;
          if (shift === 'tae' && e.type !== 'tae') return false;
          if (shift === 'Matutino' && e.shift !== 'Matutino') return false;
          if (shift === 'Vespertino' && e.shift !== 'Vespertino') return false;
        }
        return true;
      });

      document.getElementById('counter').textContent = filtered.length + ' exámenes coincidentes';

      const container = document.getElementById('labsContainer');
      container.innerHTML = '';

      LABS.forEach(lab => {
        const labCard = document.createElement('div');
        labCard.className = 'lab-card';
        
        const labExams = filtered.filter(e => e.dayIndex === activeDay && e.lab === lab);
        
        let itemsHtml = '';
        if (labExams.length === 0) {
          itemsHtml = '<div style="padding:2rem; text-align:center; color:var(--text-muted); font-size:0.85rem;">Sin exámenes programados para este filtro</div>';
        } else {
          labExams.forEach(e => {
            let badgeClass = 'badge';
            if (e.type === 'turismo') badgeClass += ' badge-turismo';
            else if (e.type === 'tae') badgeClass += ' badge-tae';
            else if (e.shift === 'Matutino') badgeClass += ' badge-matutino';
            else if (e.shift === 'Vespertino') badgeClass += ' badge-vespertino';

            itemsHtml += `
              <div class="exam-item">
                <div class="exam-time">
                  <span>⏱️ ${e.time}</span>
                  <span class="${badgeClass}">${e.group || 'General'}</span>
                </div>
                <div class="exam-title">${e.title}</div>
                <div class="exam-meta">${e.shift} · ${e.day}</div>
              </div>
            `;
          });
        }

        labCard.innerHTML = `
          <div class="lab-header">
            <span>${lab}</span>
            <span style="font-size:0.75rem; font-weight:normal;">${labExams.length} exámenes</span>
          </div>
          <div>${itemsHtml}</div>
        `;
        container.appendChild(labCard);
      });
    }

    renderApp();
  </script>
